[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anlagenwacht"
version = "0.1.0"
description = "Physics-informed anomaly detection and AI-assisted root-cause analysis for industrial plants (MVP)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "anthropic>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
anlagenwacht = "anlagenwacht.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
anlagenwacht = ["knowledge/*.md", "web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: tests that download public datasets"]
addopts = "-m 'not network'"
